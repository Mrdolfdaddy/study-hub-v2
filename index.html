<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Hub 3.0</title>

<link rel="stylesheet" href="main.css">

</head>


<body>


<div class="app">


<aside class="sidebar">


<div class="logo">

📚 Study Hub

<span>3.0</span>

</div>



<nav>


<button class="nav-btn active" onclick="showPage('dashboard')">
🏠 Dashboard
</button>


<button class="nav-btn" onclick="showPage('planner')">
📖 Learning Planner
</button>


<button class="nav-btn" onclick="showPage('projects')">
🚀 Projects
</button>


<button class="nav-btn" onclick="showPage('notes')">
📝 Notes
</button>


<button class="nav-btn" onclick="showPage('settings')">
⚙️ Settings
</button>


</nav>



<button class="theme-btn" onclick="toggleTheme()">
🌙 Theme
</button>


</aside>





<main class="main">





<section id="dashboard" class="page active">


<h1>Welcome back 👋</h1>


<div class="dashboard-grid">


<div class="card">

<h2>📅 Today</h2>

<p id="date"></p>

<p id="clock"></p>

</div>



<div class="card">

<h2>📈 Progress</h2>

<div class="progress-box">

0%

</div>

</div>




<div class="card">

<h2>🎯 Current Focus</h2>

<p>
Keep building your goals.
</p>

</div>


</div>


</section>









<section id="planner" class="page">


<div class="page-title">


<h1>📖 Learning Planner</h1>


<div class="planner-actions">


<select id="planSelector" onchange="changePlan(this.value)">
</select>


<button onclick="createPlan()">

+ New Week

</button>


</div>


</div>





<div id="plannerContainer">


<div class="card">

Loading planner...

</div>


</div>



</section>









<section id="projects" class="page">


<h1>🚀 Projects</h1>


<div class="card">


<h2>Your Projects</h2>


<textarea placeholder="Add things you are working on..."></textarea>


</div>


</section>









<section id="notes" class="page">


<h1>📝 Notes</h1>


<div class="card">


<textarea placeholder="Write notes here..."></textarea>


</div>


</section>









<section id="settings" class="page">


<h1>⚙️ Settings</h1>



<div class="settings-grid">


<div class="card">


<h2>🎨 Appearance</h2>



<label>

Font

</label>


<select id="fontSelect" onchange="changeFont(this.value)">


<option value="Segoe UI">
Segoe UI
</option>


<option value="Arial">
Arial
</option>


<option value="Verdana">
Verdana
</option>


<option value="Poppins">
Poppins
</option>


</select>




<label>

Accent Colour

</label>


<input type="color" id="accentPicker" onchange="changeAccent(this.value)">



</div>





<div class="card">


<h2>💾 Data</h2>


<button onclick="clearData()">

Reset Planner

</button>


<p>

Everything saves automatically.

</p>


</div>



</div>



</section>








</main>


</div>





<script src="storage.js"></script>

<script src="planner.js"></script>

<script src="app.js"></script>


</body>

</html>
