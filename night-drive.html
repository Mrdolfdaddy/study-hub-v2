<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT DRIVE</title>

<style>

/* =========================================================
   NIGHT DRIVE
   SPACE EDITION
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    color: white;
    font-family: 'Orbitron', sans-serif;
}

button {
    font-family: inherit;
}

/* =========================================================
   GAME
========================================================= */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(72, 45, 140, .22),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 20% 80%,
            rgba(20, 75, 150, .15),
            transparent 38%
        ),
        #02030a;
}

/* =========================================================
   SPACE BACKGROUND
========================================================= */

.space {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(76, 54, 145, .18),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 80% 20%,
            rgba(30, 90, 180, .10),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 10% 80%,
            rgba(110, 35, 160, .10),
            transparent 35%
        ),
        #02030a;
}

/* =========================================================
   NEBULAS
========================================================= */

.nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
}

.nebula.one {
    width: 600px;
    height: 300px;
    left: -180px;
    top: 20%;
    background: rgba(55, 80, 190, .10);
    transform: rotate(-25deg);
    animation: nebulaOne 18s ease-in-out infinite alternate;
}

.nebula.two {
    width: 650px;
    height: 350px;
    right: -200px;
    top: 35%;
    background: rgba(120, 45, 190, .10);
    transform: rotate(30deg);
    animation: nebulaTwo 22s ease-in-out infinite alternate;
}

.nebula.three {
    width: 500px;
    height: 250px;
    left: 35%;
    bottom: -100px;
    background: rgba(20, 110, 190, .08);
    animation: nebulaThree 15s ease-in-out infinite alternate;
}

@keyframes nebulaOne {
    from {
        transform: translate(-30px, -20px) rotate(-25deg);
    }

    to {
        transform: translate(50px, 30px) rotate(-15deg);
    }
}

@keyframes nebulaTwo {
    from {
        transform: translate(30px, 20px) rotate(30deg);
    }

    to {
        transform: translate(-50px, -30px) rotate(20deg);
    }
}

@keyframes nebulaThree {
    from {
        transform: translateX(-50px);
    }

    to {
        transform: translateX(70px);
    }
}

/* =========================================================
   STARS
========================================================= */

.stars {
    position: absolute;
    inset: -100px;
    pointer-events: none;
}

.star-layer {
    position: absolute;
    inset: 0;
    background-repeat: repeat;
}

.stars-small {
    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(150,190,255,.65) 1px, transparent 1.5px);
    background-size:
        73px 91px,
        121px 137px;
    background-position:
        10px 20px,
        40px 70px;
    opacity: .5;
    animation: starMoveOne 45s linear infinite;
}

.stars-medium {
    background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(180,170,255,.8) 1.5px, transparent 2px);
    background-size:
        173px 151px,
        211px 191px;
    background-position:
        80px 30px,
        20px 100px;
    opacity: .65;
    animation: starMoveTwo 65s linear infinite;
}

.stars-large {
    background-image:
        radial-gradient(circle, white 2px, transparent 3px),
        radial-gradient(circle, rgba(140,190,255,.9) 2px, transparent 3px);
    background-size:
        317px 271px,
        401px 347px;
    background-position:
        100px 40px,
        200px 160px;
    opacity: .7;
    animation: starMoveThree 95s linear infinite;
}

@keyframes starMoveOne {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(180px);
    }
}

@keyframes starMoveTwo {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-100px, 250px);
    }
}

@keyframes starMoveThree {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(120px, 350px);
    }
}

/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting-star {
    position: absolute;
    width: 130px;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(190,220,255,.9),
        transparent
    );
    transform: rotate(-35deg);
    opacity: 0;
    animation: shootingStar 7s linear infinite;
}

.shooting-star.one {
    top: 17%;
    left: 15%;
    animation-delay: 1s;
}

.shooting-star.two {
    top: 32%;
    right: 10%;
    animation-delay: 4s;
}

.shooting-star.three {
    top: 8%;
    right: 30%;
    animation-delay: 7s;
}

@keyframes shootingStar {

    0% {
        transform:
            translate(0, 0)
            rotate(-35deg);
        opacity: 0;
    }

    5% {
        opacity: 1;
    }

    20% {
        transform:
            translate(300px, 200px)
            rotate(-35deg);
        opacity: 0;
    }

    100% {
        opacity: 0;
    }

}

/* =========================================================
   DISTANT PLANET
========================================================= */

.planet {
    position: absolute;
    right: 9%;
    top: 12%;
    width: 95px;
    height: 95px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #7285c4,
            #303c78 40%,
            #11152e 72%,
            #050610 100%
        );

    box-shadow:
        -20px 20px 50px rgba(0,0,0,.8),
        0 0 50px rgba(70,100,210,.12);

    opacity: .65;
}

.planet::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 30px;
    left: -25px;
    top: 32px;
    border: 1px solid rgba(160,190,255,.16);
    border-radius: 50%;
    transform: rotate(-20deg);
}

/* =========================================================
   VIGNETTE
========================================================= */

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.2) 70%,
            rgba(0,0,0,.72) 100%
        );
}

/* =========================================================
   HUD
========================================================= */

.hud {
    position: absolute;
    top: 22px;
    left: 22px;
    right: 22px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    pointer-events: none;
}

.hud-side {
    display: flex;
    gap: 10px;
}

.hud-box {
    min-width: 115px;

    padding: 10px 14px;

    border-radius: 10px;

    border: 1px solid rgba(160,180,255,.16);

    background: rgba(3,5,15,.65);

    backdrop-filter: blur(14px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);
}

.hud-label {
    display: block;

    font-size: 9px;

    letter-spacing: 2px;

    color: rgba(210,220,255,.5);

    margin-bottom: 5px;
}

.hud-value {
    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1px;
}

/* =========================================================
   MENU
========================================================= */

.overlay {
    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            rgba(8,10,28,.15),
            rgba(1,2,8,.45)
        );

    backdrop-filter: blur(1px);
}

.menu {
    width: min(520px, 90vw);

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    padding: 35px 30px 40px;

    animation: menuAppear .8s ease-out;
}

@keyframes menuAppear {

    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* =========================================================
   TITLE
========================================================= */

.logo-wrap {
    position: relative;

    margin-bottom: 12px;

    padding: 10px 0;
}

.logo {
    position: relative;

    font-family: 'Audiowide', 'Orbitron', sans-serif;

    font-size: clamp(48px, 8vw, 82px);

    font-weight: 400;

    letter-spacing: 7px;

    line-height: .95;

    color: #f5f7ff;

    text-transform: uppercase;

    text-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 18px rgba(130,150,255,.55),
        0 0 45px rgba(100,80,255,.3);

    animation: titlePulse 4s ease-in-out infinite;
}

.logo::before {
    content: "NIGHT DRIVE";

    position: absolute;

    inset: 0;

    color: transparent;

    -webkit-text-stroke: 1px rgba(130,170,255,.25);

    transform: translate(3px, 3px);

    z-index: -1;
}

@keyframes titlePulse {

    0%,
    100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.18);
    }

}

.title-line {
    width: 190px;
    height: 1px;

    margin: 12px auto 14px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(150,175,255,.8),
            transparent
        );

    box-shadow:
        0 0 12px rgba(120,150,255,.5);
}

.subtitle {
    font-size: 10px;

    letter-spacing: 7px;

    color: rgba(215,225,255,.55);

    margin-left: 7px;

    text-transform: uppercase;
}

/* =========================================================
   MENU BUTTONS
========================================================= */

.menu-buttons {
    width: min(330px, 85vw);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;

    margin-top: 32px;
}

.menu-button {
    position: relative;

    width: 100%;

    min-height: 54px;

    padding: 15px 20px;

    border-radius: 10px;

    border: 1px solid rgba(150,175,255,.25);

    background:
        linear-gradient(
            135deg,
            rgba(20,27,55,.78),
            rgba(8,12,28,.78)
        );

    color: rgba(240,244,255,.95);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 3px;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.menu-button::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: -100%;

    width: 70%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(170,190,255,.12),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .5s ease;
}

.menu-button:hover {
    transform: translateY(-2px);

    border-color: rgba(160,190,255,.65);

    background:
        linear-gradient(
            135deg,
            rgba(35,45,85,.9),
            rgba(10,16,38,.9)
        );

    box-shadow:
        0 8px 30px rgba(60,80,180,.18),
        inset 0 0 20px rgba(120,150,255,.04);
}

.menu-button:hover::before {
    left: 140%;
}

.menu-button:active {
    transform: translateY(0);
}

.menu-button.primary {
    border-color: rgba(145,165,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(48,57,105,.9),
            rgba(20,25,58,.9)
        );

    box-shadow:
        0 0 25px rgba(100,120,255,.1);
}

.menu-button.primary:hover {
    box-shadow:
        0 0 35px rgba(100,130,255,.2);
}

/* =========================================================
   SMALL MENU FOOTER
========================================================= */

.menu-footer {
    margin-top: 25px;

    font-size: 8px;

    letter-spacing: 3px;

    color: rgba(190,205,240,.3);
}

/* =========================================================
   GAME ROAD
========================================================= */

.road {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 70%;
    height: 55%;

    background:
        linear-gradient(
            90deg,
            #0a0b12,
            #151721 45%,
            #181a24 50%,
            #151721 55%,
            #0a0b12
        );

    clip-path:
        polygon(
            38% 0,
            62% 0,
            100% 100%,
            0 100%
        );

    opacity: .9;
}

.road-lines {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 8%;
    height: 55%;

    clip-path:
        polygon(
            45% 0,
            55% 0,
            100% 100%,
            0 100%
        );

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 70px,
            rgba(190,210,255,.55) 70px,
            rgba(190,210,255,.55) 105px
        );

    animation:
        roadMove .55s linear infinite;
}

@keyframes roadMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 175px;
    }

}

/* =========================================================
   PLAYER
========================================================= */

.player {
    position: absolute;

    left: 50%;
    bottom: 8%;

    width: 90px;
    height: 155px;

    transform: translateX(-50%);

    z-index: 15;
}

.car-body {
    position: absolute;

    left: 8px;
    top: 8px;

    width: 74px;
    height: 135px;

    border-radius: 23px 23px 13px 13px;

    background:
        linear-gradient(
            90deg,
            #10131d,
            #374052,
            #12151e
        );

    border: 2px solid rgba(180,200,255,.5);

    box-shadow:
        0 0 25px rgba(90,130,255,.2);
}

.car-roof {
    position: absolute;

    left: 17px;
    top: 28px;

    width: 56px;
    height: 62px;

    border-radius: 16px 16px 9px 9px;

    background:
        linear-gradient(
            135deg,
            #182238,
            #070b13
        );

    border: 1px solid rgba(180,200,255,.3);
}

.car-window {
    position: absolute;

    left: 23px;
    top: 35px;

    width: 44px;
    height: 38px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #203b5d,
            #07101d
        );
}

.headlight {
    position: absolute;

    top: 108px;

    width: 18px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 22px rgba(130,190,255,.9);
}

.headlight.left {
    left: 15px;
}

.headlight.right {
    right: 15px;
}

.wheel {
    position: absolute;

    top: 52px;

    width: 12px;
    height: 34px;

    border-radius: 8px;

    background: #030407;
}

.wheel.left {
    left: -4px;
}

.wheel.right {
    right: -4px;
}

/* =========================================================
   TRAFFIC
========================================================= */

.traffic {
    position: absolute;

    width: 54px;
    height: 98px;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #141720,
            #3c4657,
            #13161e
        );

    border: 1px solid rgba(180,200,255,.35);

    z-index: 10;
}

.traffic::before {
    content: "";

    position: absolute;

    left: 8px;
    top: 16px;

    width: 36px;
    height: 29px;

    border-radius: 8px;

    background: #0b1627;
}

.traffic::after {
    content: "";

    position: absolute;

    left: 9px;
    right: 9px;
    bottom: 9px;

    height: 6px;

    border-radius: 50%;

    background: #ff2945;

    box-shadow:
        0 0 10px #ff2945;
}

/* =========================================================
   RESULT SCREEN
========================================================= */

.result {
    display: none;
}

.result.active {
    display: flex;
}

.result-title {
    font-family: 'Audiowide', sans-serif;

    font-size: 38px;

    letter-spacing: 4px;

    margin-bottom: 25px;

    text-shadow:
        0 0 20px rgba(140,160,255,.4);
}

.result-stat {
    margin: 8px;

    font-size: 11px;

    letter-spacing: 2px;

    color: rgba(210,220,245,.55);
}

.result-stat strong {
    color: white;
}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

.mobile-controls {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 20px;

    display: none;

    justify-content: space-between;

    z-index: 40;
}

.control-button {
    width: 70px;
    height: 70px;

    border-radius: 50%;

    border: 1px solid rgba(170,190,255,.3);

    background: rgba(5,8,20,.7);

    color: white;

    font-size: 23px;
}

@media(max-width: 800px) {

    .hud {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .hud-box {
        min-width: 85px;
        padding: 8px;
    }

    .hud-value {
        font-size: 11px;
    }

    .planet {
        right: -20px;
        top: 12%;
        transform: scale(.65);
    }

    .mobile-controls {
        display: flex;
    }

    .logo {
        font-size: 43px;
        letter-spacing: 4px;
    }

    .subtitle {
        letter-spacing: 5px;
    }

}

/* =========================================================
   HIDDEN
========================================================= */

.hidden {
    display: none !important;
}

</style>

</head>

<body>

<div id="game">

    <!-- =====================================================
         SPACE
    ====================================================== -->

    <div class="space">

        <div class="nebula one"></div>
        <div class="nebula two"></div>
        <div class="nebula three"></div>

        <div class="stars">

            <div class="star-layer stars-small"></div>
            <div class="star-layer stars-medium"></div>
            <div class="star-layer stars-large"></div>

        </div>

        <div class="shooting-star one"></div>
        <div class="shooting-star two"></div>
        <div class="shooting-star three"></div>

        <div class="planet"></div>

    </div>

    <div class="vignette"></div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div class="hud">

        <div class="hud-side">

            <div class="hud-box">

                <span class="hud-label">
                    SCORE
                </span>

                <span
                    class="hud-value"
                    id="score">
                    0
                </span>

            </div>

            <div class="hud-box">

                <span class="hud-label">
                    DISTANCE
                </span>

                <span
                    class="hud-value"
                    id="distance">
                    0 m
                </span>

            </div>

        </div>


        <div class="hud-side">

            <div class="hud-box">

                <span class="hud-label">
                    SPEED
                </span>

                <span
                    class="hud-value"
                    id="speed">
                    0 KM/H
                </span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ROAD
    ====================================================== -->

    <div class="road"></div>
    <div class="road-lines"></div>


    <!-- =====================================================
         PLAYER
    ====================================================== -->

    <div
        class="player"
        id="player">

        <div class="car-body"></div>

        <div class="car-roof"></div>

        <div class="car-window"></div>

        <div class="wheel left"></div>
        <div class="wheel right"></div>

        <div class="headlight left"></div>
        <div class="headlight right"></div>

    </div>


    <!-- =====================================================
         TRAFFIC
    ====================================================== -->

    <div id="trafficContainer"></div>


    <!-- =====================================================
         MOBILE
    ====================================================== -->

    <div class="mobile-controls">

        <button
            class="control-button"
            id="leftButton">

            ◀

        </button>

        <button
            class="control-button"
            id="rightButton">

            ▶

        </button>

    </div>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <div
        class="overlay"
        id="startScreen">

        <div class="menu">

            <div class="logo-wrap">

                <div class="logo">
                    NIGHT DRIVE
                </div>

                <div class="title-line"></div>

                <div class="subtitle">
                    AFTER DARK
                </div>

            </div>


            <div class="menu-buttons">

                <button
                    class="menu-button primary"
                    onclick="startGame()">

                    START DRIVE

                </button>

                <button
                    class="menu-button"
                    onclick="showComingSoon('GARAGE')">

                    GARAGE

                </button>

                <button
                    class="menu-button"
                    onclick="showComingSoon('LEADERBOARD')">

                    LEADERBOARD

                </button>

                <button
                    class="menu-button"
                    onclick="showComingSoon('SETTINGS')">

                    SETTINGS

                </button>

            </div>


            <div class="menu-footer">

                DRIVE • ESCAPE • REPEAT

            </div>

        </div>

    </div>


    <!-- =====================================================
         RESULT
    ====================================================== -->

    <div
        class="overlay result"
        id="resultScreen">

        <div class="menu">

            <div class="result-title">
                RUN OVER
            </div>

            <div class="result-stat">

                SCORE:
                <strong id="finalScore">
                    0
                </strong>

            </div>

            <div class="result-stat">

                DISTANCE:
                <strong id="finalDistance">
                    0 m
                </strong>

            </div>

            <div class="result-stat">

                BEST:
                <strong id="finalBest">
                    0
                </strong>

            </div>


            <div class="menu-buttons">

                <button
                    class="menu-button primary"
                    onclick="startGame()">

                    DRIVE AGAIN

                </button>

                <button
                    class="menu-button"
                    onclick="returnToStudyHub()">

                    EXIT

                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById("player");

const trafficContainer =
    document.getElementById("trafficContainer");

const scoreDisplay =
    document.getElementById("score");

const distanceDisplay =
    document.getElementById("distance");

const speedDisplay =
    document.getElementById("speed");

const startScreen =
    document.getElementById("startScreen");

const resultScreen =
    document.getElementById("resultScreen");

const finalScore =
    document.getElementById("finalScore");

const finalDistance =
    document.getElementById("finalDistance");

const finalBest =
    document.getElementById("finalBest");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");


/* =========================================================
   GAME STATE
========================================================= */

let gameRunning = false;

let playerX = 50;

let score = 0;

let distance = 0;

let speed = 8;

let traffic = [];

let spawnTimer = 0;

let lastTime = 0;

let animationFrame;

let bestScore =
    Number(
        localStorage.getItem(
            "nightDriveBest"
        ) || 0
    );


/* =========================================================
   START
========================================================= */

function startGame() {

    gameRunning = true;

    score = 0;

    distance = 0;

    speed = 8;

    playerX = 50;

    spawnTimer = 0;

    traffic.forEach(
        car => car.element.remove()
    );

    traffic = [];

    player.style.left = "50%";

    scoreDisplay.textContent = "0";

    distanceDisplay.textContent = "0 m";

    speedDisplay.textContent = "8 KM/H";

    startScreen.style.display = "none";

    resultScreen.classList.remove("active");

    lastTime = performance.now();

    cancelAnimationFrame(
        animationFrame
    );

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    if (!gameRunning) return;

    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;

    updateGame(delta);

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   UPDATE
========================================================= */

function updateGame(delta) {

    score += .15 * delta;

    distance +=
        speed *
        .035 *
        delta;

    speed +=
        .002 *
        delta;

    if (speed > 25) {
        speed = 25;
    }


    scoreDisplay.textContent =
        Math.floor(score);

    distanceDisplay.textContent =
        Math.floor(distance) + " m";

    speedDisplay.textContent =
        Math.floor(speed) + " KM/H";


    spawnTimer -= delta;

    if (spawnTimer <= 0) {

        spawnTraffic();

        spawnTimer =
            Math.max(
                18,
                55 - speed * 1.5
            );

    }


    for (
        let i = traffic.length - 1;
        i >= 0;
        i--
    ) {

        const car =
            traffic[i];

        car.y +=
            speed *
            .55 *
            delta;

        car.element.style.top =
            car.y + "px";


        if (checkCollision(car)) {

            endGame();

            return;

        }


        if (
            car.y >
            window.innerHeight + 150
        ) {

            car.element.remove();

            traffic.splice(i, 1);

        }

    }

}


/* =========================================================
   TRAFFIC
========================================================= */

function spawnTraffic() {

    const element =
        document.createElement("div");

    element.className =
        "traffic";


    const lanes = [
        38,
        44,
        50,
        56,
        62
    ];


    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    element.style.left =
        lane + "%";

    element.style.top =
        "-130px";


    trafficContainer.appendChild(
        element
    );


    traffic.push({

        element: element,

        x: lane,

        y: -130

    });

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(car) {

    const playerRect =
        player.getBoundingClientRect();

    const carRect =
        car.element.getBoundingClientRect();


    return !(
        playerRect.right <
            carRect.left + 8 ||

        playerRect.left + 8 >
            carRect.right ||

        playerRect.bottom <
            carRect.top + 10 ||

        playerRect.top + 10 >
            carRect.bottom
    );

}


/* =========================================================
   END GAME
========================================================= */

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(
        animationFrame
    );


    const currentScore =
        Math.floor(score);


    if (
        currentScore >
        bestScore
    ) {

        bestScore =
            currentScore;

        localStorage.setItem(
            "nightDriveBest",
            bestScore
        );

    }


    finalScore.textContent =
        currentScore;

    finalDistance.textContent =
        Math.floor(distance) +
        " m";

    finalBest.textContent =
        bestScore;


    resultScreen.classList.add(
        "active"
    );

}


/* =========================================================
   STEERING
========================================================= */

function moveLeft() {

    if (!gameRunning) return;

    playerX -= 3;

    if (playerX < 39) {
        playerX = 39;
    }

    player.style.left =
        playerX + "%";

}


function moveRight() {

    if (!gameRunning) return;

    playerX += 3;

    if (playerX > 61) {
        playerX = 61;
    }

    player.style.left =
        playerX + "%";

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            moveLeft();

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            moveRight();

        }

    }
);


/* =========================================================
   MOBILE
========================================================= */

leftButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveLeft();

    }
);


rightButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveRight();

    }
);


leftButton.addEventListener(
    "mousedown",
    moveLeft
);


rightButton.addEventListener(
    "mousedown",
    moveRight
);


/* =========================================================
   COMING SOON
========================================================= */

function showComingSoon(section) {

    alert(
        section +
        " is coming soon."
    );

}


/* =========================================================
   EXIT
========================================================= */

function returnToStudyHub() {

    if (
        window.parent !== window
    ) {

        window.parent.location.hash =
            "dashboard";

    } else {

        window.location.href =
            "index.html";

    }

}


/* =========================================================
   PREVENT TOUCH SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
